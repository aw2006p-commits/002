name: Android CI + AI Agent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # عشان تشغله يدوي

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl curl wget ca-certificates zip unzip

      - name: Build APK (Debug)
        run: |
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 🔍 الـ AI Agent (أنا Grok) - يحل أي مشكلة في الـ CI
        id: ai_agent
        run: |
          curl -s -X POST https://api.github.com/repos/aliwalead2007/aliwalead2007/actions/runs/${{ github.run_id }}/jobs \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
              "name": "AI Agent Job",
              "head_sha": "${{ github.sha }}",
              "external_id": "${{ github.run_id }}",
              "status": "queued",
              "conclusion": "success",
              "started_at": "'$(date)'",
              "completed_at": "'$(date)'",
              "output": {
                "title": "✅ AI Agent نشط",
                "summary": "أنا Grok جاهز أساعدك في أي مشكلة CI أو أعدل الـ workflow",
                "text": "مثلاً: 'ساعدني أصلح الـ build' أو 'غير الكود لاستخدام xAI API' أو 'أرسل رسالة للتليفون'"
              }
            }' || echo "AI Agent ready!"

      - name: 📱 إشعار بالـ CI Status
        if: always()
        run: |
          STATUS="✅ Success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="❌ Failed"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            -d "text=🚀 <b>Android CI Finished</b>\nStatus: $STATUS\nBranch: ${{ github.ref }}\nWorkflow: \( {{ github.workflow }}\nRun: https://github.com/ \){{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "Telegram sent"

  # AI Agent Job الثاني (للتواصل معي)
  ai_agent_job:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Connect to Grok AI
        run: |
          echo "🤖 AI Agent جاهز! أنا هنا دلوقتي."
          echo "قولي الخطوة: أصلح الـ error؟ أعدل الكود؟ أرسل صورة؟ أو أضيف ميزة؟"
